[project]
name = "lattice-lab"
version = "0.1.0"
description = "A law-discovery loop over LatticeLife experiments and Kepler fits: pre-registered predictions, held-out tests, an append-only ledger."
readme = "README.md"
# LatticeLife's own bound: its locked pygame and moderngl ship wheels for 3.12 and 3.13 only.
requires-python = ">=3.12,<3.14"
dependencies = [
    "latticelife",
    "kepler",
    "numpy>=1.26",
    "scipy>=1.10",
]

[project.scripts]
lattice-lab = "lattice_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# Both libraries are pinned to git commits until each makes releases. A result's ledger entry
# records the commits actually installed, so moving a pin never changes what an old result
# means. To work against local checkouts instead, after `uv sync` run
# `uv pip install -e ../gameoflife_advanced -e ../kepler` (the ledger then records their commits
# and whether the working tree was dirty).
[tool.uv.sources]
latticelife = { git = "https://github.com/PolyLabs-research/gameoflife_advanced", rev = "256450b5bf82862ce66d26b8a6a12a3ff04146f6" }
kepler = { git = "https://github.com/PolyLabs-research/kepler", rev = "0af9b28c5586376219ec17b8620e9dbc726701d8" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lattice_lab"]

[tool.ruff]
line-length = 100
# The LLM pilots' submissions are kept verbatim, as the agents wrote them.
extend-exclude = [
    "examples/llm-pilot/submission",
    "examples/llm-pilot-triangle/submission",
    "examples/llm-pilot-vot13/submission",
    "examples/llm-pilot-37/submission",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
