# How does the settling time of B2/S34 soups grow with torus size on the hexagon lattice?
#
# The settling-time prototype (2026-10-16) found T ~ 27 L^0.35 for this rule, with all four
# held-out sizes inside their 95% intervals. This question asks it again under the full loop:
# pre-registered predictions, a joint held-out test, and the fragility check.

id = "settling-time-hexagon-B2S34"
quantity = "settling_time"
rule = "B2/S34"
shape = "hexagon"
density = 0.5
seeds = 20

# What the fit may see, and the pool the held-out sizes are chosen from. Hexagon tori need an
# even width; a rectangle such as "24x26" samples between squares.
fit_sizes = [8, 10, 12, 16, 20, 24, 32]
heldout_pool = [40, 48, 64, 96, 128]
heldout_per_round = 3
max_rounds = 2

cap = 2000          # a seed not repeated by then is rerun at 4x the cap, up to max_cap
max_cap = 64000
laws = ["constant", "logarithmic", "linear", "power", "exponential", "exponential_area"]
