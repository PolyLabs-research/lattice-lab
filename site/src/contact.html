<main class="wrap gutter">
  <header class="prose">
    <div class="eyebrow">Contact</div>
    <h1>Write to us</h1>
    <p class="lede">Questions about the results, the proofs or the pilots, a law you think is wrong,
      or a test you would like to see registered.</p>
    <p>Email <a href="mailto:contact@polylabs-research.net">contact@polylabs-research.net</a>, or
      use the form below. Both reach the same inbox.</p>
  </header>

  <form id="contact-form" class="figure contact-form" data-endpoint="https://script.google.com/macros/s/AKfycbzMEOqii1vDIX6uH_RuSysHjwKFL7L6lopcv_PJd_hm9mKvZwOHUqz8tzV1pECqusYgwA/exec" aria-labelledby="form-title">
    <h2 id="form-title">Send a message</h2>
    <label class="field">Your name
      <input type="text" name="name" autocomplete="name" maxlength="200">
    </label>
    <label class="field">Your email, so we can reply
      <input type="email" name="email" autocomplete="email" maxlength="200" required>
    </label>
    <label class="field">Message
      <textarea name="message" rows="8" maxlength="10000" required></textarea>
    </label>
    <!-- people never see this field; a bot that fills it in is ignored -->
    <div class="hp" aria-hidden="true">
      <label>Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    </div>
    <div class="row">
      <button class="primary" type="submit">Send</button>
      <p class="note" id="contact-status" aria-live="polite"></p>
    </div>
    <p class="note">We use your address only to reply to you.</p>
  </form>
</main>
