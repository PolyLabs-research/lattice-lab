name = "LatticeProofs"
defaultTargets = ["LatticeProofs"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "LatticeProofs"
# HexTwoPart and TriTwoPart are the LLM pilots' proofs (examples/llm-pilot and
# examples/llm-pilot-triangle), kept verbatim. Each imports the root
# module, so each is a root of its own rather than imported by it.
roots = ["LatticeProofs", "LatticeProofs.HexTwoPart", "LatticeProofs.TriTwoPart"]
