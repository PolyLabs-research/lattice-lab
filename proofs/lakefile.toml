name = "LatticeProofs"
defaultTargets = ["LatticeProofs"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "LatticeProofs"
# HexTwoPart, TriTwoPart, VOT13Law and Cubes37 are the LLM pilots' proofs (examples/llm-pilot,
# examples/llm-pilot-triangle, examples/llm-pilot-vot13 and examples/llm-pilot-37), kept
# verbatim except for Cubes37's namespace (Pilot in the sandbox). Each imports the root module,
# so each is a root of its own rather than imported by it.
roots = ["LatticeProofs", "LatticeProofs.HexTwoPart", "LatticeProofs.TriTwoPart",
  "LatticeProofs.VOT13Law", "LatticeProofs.Cubes37"]
